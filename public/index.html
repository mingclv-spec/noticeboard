<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noticeboard</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--line:#252a35;--fg:#e7eaf0;--muted:#8b93a7;--accent:#4f8cff}
  @media (prefers-color-scheme: light){:root{--bg:#f5f6f8;--card:#fff;--line:#e4e7ee;--fg:#1b1f27;--muted:#6b7385;--accent:#2f6fed}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:24px 16px 64px}
  header h1{font-size:22px;margin:0 0 4px}
  header p{margin:0 0 20px;color:var(--muted);font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
  input,textarea,button{font:inherit}
  input,textarea{width:100%;background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);margin:0 0 10px;outline:none}
  input:focus,textarea:focus{border-color:var(--accent)}
  textarea{min-height:84px;resize:vertical}
  button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .post{margin:0 0 14px}
  .meta{display:flex;gap:8px;align-items:baseline;color:var(--muted);font-size:13px;margin-bottom:6px}
  .name{color:var(--fg);font-weight:600;font-size:14px}
  .body{white-space:pre-wrap;word-break:break-word}
  .replies{margin-top:12px;padding-left:12px;border-left:2px solid var(--line)}
  .reply{margin:8px 0}
  .reply .body{font-size:15px}
  .replybox{display:flex;gap:8px;margin-top:10px}
  .replybox input{margin:0}
  .replybox button{padding:8px 14px;white-space:nowrap}
  .empty{color:var(--muted);text-align:center;padding:28px 0}
  .del{background:transparent;border:0;color:var(--muted);padding:0 2px;font-size:12px;cursor:pointer;text-decoration:underline;width:auto}
  #codebox{display:none;background:var(--card);border:1px solid var(--accent);border-radius:10px;padding:12px;margin:0 0 14px;font-size:14px}
  #codebox b{color:var(--fg);letter-spacing:2px;font-size:16px}
  .err{color:#ff6b6b;font-size:14px;margin:6px 0 0}
  .count{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Noticeboard</h1>
    <p>A public board — anyone can ask, anyone can answer. Please keep it civil.</p>
  </header>

  <div class="card">
    <input id="name" maxlength="40" placeholder="Your name (optional)">
    <textarea id="body" maxlength="2000" placeholder="Ask something, or share something…"></textarea>
    <button id="send">Post</button>
    <div class="err" id="err"></div>
  </div>

  <div id="codebox"></div>
  <div class="count" id="count"></div>
  <div style="margin-top:6px"><button id="usecode" class="del">Have a delete code?</button></div>
  <div id="list" style="margin-top:12px"></div>
</div>

<script>
const list = document.getElementById('list');
const err = document.getElementById('err');
const count = document.getElementById('count');
const codebox = document.getElementById('codebox');
let CODES = {};
try { CODES = JSON.parse(localStorage.getItem('nb_codes') || '{}') || {}; } catch(e){ CODES = {}; }
function saveCode(id, code){
  CODES[id] = code;
  localStorage.setItem('nb_codes', JSON.stringify(CODES));
  codebox.style.display = 'block';
  codebox.textContent = '';
  const t = document.createElement('div');
  t.textContent = 'Your delete code for post #' + id + ': ';
  const b = document.createElement('b');
  b.textContent = code;
  const hint = document.createElement('div');
  hint.style.marginTop = '6px';
  hint.style.color = 'var(--muted)';
  hint.textContent = 'Saved on this device. Keep it — you need it to delete the post from another device.';
  codebox.append(t, b, hint);
}

function fmt(ts){
  const d = new Date(ts);
  const diff = Math.floor((Date.now() - ts)/1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + ' min ago';
  if (diff < 86400) return Math.floor(diff/3600) + ' h ago';
  const p = (n) => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function render(posts){
  list.textContent = '';
  count.textContent = posts.length ? posts.length + (posts.length === 1 ? ' post' : ' posts') : '';
  if (!posts.length){
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = 'No posts yet — be the first.';
    list.appendChild(e);
    return;
  }
  for (const p of posts){
    const card = document.createElement('div');
    card.className = 'card post';

    const meta = document.createElement('div');
    meta.className = 'meta';
    const nm = document.createElement('span');
    nm.className = 'name';
    nm.textContent = p.name;
    const tm = document.createElement('span');
    tm.textContent = fmt(p.created_at);
    meta.append(nm, tm);
    if (CODES[p.id]){
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = 'Delete';
      del.onclick = async () => {
        if (!confirm('Delete this post?')) return;
        const res = await fetch('/api/posts/' + p.id, { method:'DELETE', headers:{ 'x-delete-code': CODES[p.id] } });
        if (res.ok){
          delete CODES[p.id];
          localStorage.setItem('nb_codes', JSON.stringify(CODES));
          codebox.style.display = 'none';
          load();
        } else {
          alert('Could not delete this post.');
        }
      };
      meta.appendChild(del);
    }

    const body = document.createElement('div');
    body.className = 'body';
    body.textContent = p.body;

    card.append(meta, body);

    if (p.replies && p.replies.length){
      const box = document.createElement('div');
      box.className = 'replies';
      for (const r of p.replies){
        const rw = document.createElement('div');
        rw.className = 'reply';
        const rm = document.createElement('div');
        rm.className = 'meta';
        const rn = document.createElement('span');
        rn.className = 'name';
        rn.textContent = r.name;
        const rt = document.createElement('span');
        rt.textContent = fmt(r.created_at);
        rm.append(rn, rt);
        const rb = document.createElement('div');
        rb.className = 'body';
        rb.textContent = r.body;
        rw.append(rm, rb);
        box.appendChild(rw);
      }
      card.appendChild(box);
    }

    const form = document.createElement('div');
    form.className = 'replybox';
    const input = document.createElement('input');
    input.placeholder = 'Write your answer…';
    input.maxLength = 2000;
    const btn = document.createElement('button');
    btn.textContent = 'Reply';
    btn.onclick = async () => {
      const text = input.value.trim();
      if (!text) return;
      btn.disabled = true;
      try{
        const res = await fetch('/api/posts/' + p.id + '/replies', {
          method:'POST', headers:{'content-type':'application/json'},
          body: JSON.stringify({ name: document.getElementById('name').value, body: text })
        });
        if (!res.ok){ const j = await res.json().catch(()=>({})); throw new Error(j.error || 'Failed to send'); }
        input.value = '';
        await load();
      }catch(e){ alert(e.message); }
      btn.disabled = false;
    };
    input.addEventListener('keydown', (e)=>{ if (e.key === 'Enter'){ e.preventDefault(); btn.click(); } });
    form.append(input, btn);
    card.appendChild(form);

    list.appendChild(card);
  }
}

async function load(){
  try{
    const res = await fetch('/api/posts', { cache:'no-store' });
    const j = await res.json();
    render(j.posts || []);
  }catch(e){ /* ignore */ }
}

document.getElementById('send').onclick = async () => {
  err.textContent = '';
  const body = document.getElementById('body').value.trim();
  if (body.length < 2){ err.textContent = 'Too short.'; return; }
  const btn = document.getElementById('send');
  btn.disabled = true;
  try{
    const res = await fetch('/api/posts', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ name: document.getElementById('name').value, body })
    });
    if (!res.ok){ const j = await res.json().catch(()=>({})); throw new Error(j.error || 'Failed to send'); }
    const j = await res.json().catch(()=>({}));
    if (j.id && j.delete_code) saveCode(j.id, j.delete_code);
    document.getElementById('body').value = '';
    await load();
  }catch(e){ err.textContent = e.message; }
  btn.disabled = false;
};

document.getElementById('usecode').onclick = async () => {
  const id = prompt('Post ID?');
  if (!id) return;
  const code = prompt('Delete code?');
  if (!code) return;
  const res = await fetch('/api/posts/' + id.trim(), {
    method: 'DELETE',
    headers: { 'x-delete-code': code.trim().toUpperCase() }
  });
  if (res.ok){
    codebox.style.display = 'none';
    load();
  } else {
    alert('Could not delete — check the post ID and code.');
  }
};

load();
setInterval(load, 15000);
</script>
</body>
</html>
